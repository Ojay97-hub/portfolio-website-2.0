<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    
    <!-- Google Fonts - Direct Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Apply the saved (or OS) theme before first paint to avoid a flash -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>

    <!-- Critical CSS for above-the-fold content -->
    <style>
      body {
        margin: 0;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        /* Match the brand canvas so there's no flash before React mounts */
        background: #F7FCFC;
        color: #0F2233;
      }
      html.dark body {
        background: #050C12;
        color: #EAFBFA;
      }
      .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(63, 210, 198, 0.25);
        border-top-color: #138E8D;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    
    <meta name="theme-color" content="#F7FCFC" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Owen Cotter Portfolio | Full Stack Developer &amp; UI Designer</title>
    <meta name="description" content="Portfolio of Owen Cotter, a Junior Full Stack Developer and UI Designer working with React, Django and modern web applications. Open to my first developer role." />
    <meta name="keywords" content="Owen Cotter, full-stack developer, UI designer, React, Django, JavaScript, Python, web development, junior developer, portfolio, Swansea, Wales" />
    <meta name="author" content="Owen Cotter" />
    
  </head>
  <body>
    <div id="root">
      <!-- Loading state while React loads -->
      <div class="loading-spinner">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
